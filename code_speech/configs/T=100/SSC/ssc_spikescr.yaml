# General Configuration
general:
  dataset: ssc
  datasets_path: Datasets/SSC
  gpu: 0
  seed: 42
  seed_list: [42, 43, 44, 45, 46]
  backend: cupy
  make_plot: false

model:
  model_name: spikescr
  spike_mode: lif

  # SSC input
  duration: 10
  n_bins: 5

  depths: 2
  attention_window: 20
  n_hidden_neurons: 256
  n_hidden_neurons_list:
    - 256

  num_heads: 16
  mlp_ratio: 4
  dropout_l: 0.1
  dropout_p: 0.1
  attn_mode: v2
  kernel_size: 31
  bias: true

  # spiking neuron
  init_tau: 2.0
  v_threshold: 1.0
  v_reset: 0.5
  surrogate_function_type: atan
  alpha: 5.0
  detach_reset: true

modules:
  use_dw_bias: false

augmentation:
  use_aug: true

  # Time and neuron masking
  TN_mask_aug_proba: 0.5
  time_mask_proportion: 0.1
  neuron_mask_size: 10

training:
  epochs: 300
  batch_size: 256
  keep_ratio: 1.0
  loss: sum
  loss_fn: CEloss
  early_stop: false
  early_stop_metric: acc
  patience: 20
  min_delta: 0.001
  warmup_epochs: 5

optimization:
  optimizer_w: adamw
  lr_w: 0.005
  weight_decay: 0.01
  t_max: 40
